name = "kraysdhaka-host"
main = "worker/index.ts"
compatibility_date = "2026-10-23"

# Cloudflare Workers Static Assets configuration
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Relational Catalog Database
# Create with: wrangler d1 create kraysdhaka-db
# Apply migrations: wrangler d1 execute kraysdhaka-db --file=./migrations/0001_init.sql
# Seed catalog: wrangler d1 execute kraysdhaka-db --file=./migrations/0002_seed_products.sql
[[d1_databases]]
binding = "DB"
database_name = "kraysdhaka-db"
database_id = "bab4ac60-15d0-4ef3-bbf3-2235f8d1fc68"

# Cloudflare R2 Object Storage for Garment Photography Assets
# Create with: wrangler r2 bucket create kraysdhaka-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "krays-dhaka-products"
